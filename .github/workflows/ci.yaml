name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Check TypeScript
        run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run ESLint
        run: npm run lint

  build:
    name: Production Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build shared
        run: npm run build --workspace=@shared/types

      - name: Build server
        run: npm run build --workspace=split-app-server

      - name: Build client
        run: npm run build --workspace=split-app-client

  e2e:
    name: Cypress E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    needs:
      - typecheck
      - lint
      - build

    env:
      CI: "true"
      CYPRESS_BASE_URL: http://localhost
      COMPOSE_PROJECT_NAME: split-app-ci

      POSTGRES_DB: splitapp_ci
      POSTGRES_USER: splitapp_ci
      POSTGRES_PASSWORD: ci_only_password

      PORT: "3001"
      CLIENT_ORIGIN: http://localhost

      LOG_LEVEL: info

      RATE_LIMIT_WINDOW_MS: "900000"
      RATE_LIMIT_MAX: "1000"

      ROOM_TTL_DAYS: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate Docker Compose
        env:
          NODE_ENV: production
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            config

      - name: Start production stack
        env:
          NODE_ENV: production
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            up -d --build

      - name: Wait for application
        shell: bash
        env:
          NODE_ENV: production
        run: |
          for attempt in {1..60}; do
            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost/ready
            then
              echo
              echo "Application is ready"
              exit 0
            fi

            echo "Waiting for application: ${attempt}/60"
            sleep 2
          done

          echo "Application did not become ready"

          docker compose \
            -f docker-compose.prod.yml \
            ps

          docker compose \
            -f docker-compose.prod.yml \
            logs \
            --no-color

          exit 1

      - name: Run Cypress E2E
        uses: cypress-io/github-action@v7
        with:
          working-directory: .
          install-command: >-
            npm ci
            --include=dev
            --workspaces
            --include-workspace-root=true
          browser: electron
          summary-title: Split App E2E

      - name: Collect Docker logs
        if: always()
        continue-on-error: true
        env:
          NODE_ENV: production
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            logs \
            --no-color \
            > docker-compose.log

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            cypress/screenshots/
            cypress/videos/
            docker-compose.log

      - name: Stop production stack
        if: always()
        continue-on-error: true
        env:
          NODE_ENV: production
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            down \
            --volumes \
            --remove-orphans

  publish-images:
    name: Publish ${{ matrix.name }} image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs:
      - e2e

    # Образы публикуются только после push в main.
    # Для pull request, develop и ручного запуска job будет пропущен.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server
            image: split-app-server
            dockerfile: server/Dockerfile.prod

          - name: Client
            image: split-app-client
            dockerfile: client/Dockerfile.prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/${{ matrix.image }}"

          echo "name=${image}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true

          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
