apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: split-app
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: split-app
spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP