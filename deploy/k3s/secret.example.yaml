apiVersion: v1
kind: Secret
metadata:
  name: split-app-secrets
  namespace: split-app
  labels:
    app.kubernetes.io/name: split-app
    app.kubernetes.io/part-of: split-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: change_me_to_a_strong_password

  DATABASE_URL: >-
    postgres://splitapp:change_me_to_a_strong_password@postgres:5432/splitapp